<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Test Registration</title>
<style>body{font-family:system-ui;max-width:420px;margin:40px auto}label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:16px;padding:10px 16px}#result{margin-top:16px;color:#555}</style>
</head>
<body>
<h1>Create account</h1>
<form id="reg" action="/register.html" method="get" onsubmit="event.preventDefault();document.getElementById('result').textContent='Check your email to confirm your account';">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username">
  <label for="email">Email</label><p style="font-size:12px;color:#777;margin:0">Note: disposable / temporary email addresses are not allowed.</p>
  <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="password">Password (min 10)</label>
  <input id="password" name="password" type="password" minlength="10" autocomplete="new-password">
  <label for="password2">Confirm password</label>
  <input id="password2" name="password_confirm" type="password" autocomplete="new-password">
  <button type="submit">Sign up</button>
</form>
<div id="result"></div>
</body>
</html>
