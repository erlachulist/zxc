<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Log in</title>
<style>body{font-family:system-ui;max-width:420px;margin:40px auto}label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:16px;padding:10px 16px}</style>
</head>
<body>
<h1>Log in to your account</h1>
<form id="login" onsubmit="event.preventDefault()">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
<p>Don't have an account? <a href="/register.html">Sign up</a></p>
</body>
</html>
